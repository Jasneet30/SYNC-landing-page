<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover Artists — A-Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#10131a;color:#fff;font-family:Manrope}.nav{padding:22px 7vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff15}.brand{font:800 22px Sora}.brand i{font-style:normal;background:linear-gradient(135deg,#ff4d9d,#6c3bff);padding:5px 9px;border-radius:8px;margin-right:7px}main{padding:65px 7vw}h1{font:800 clamp(38px,6vw,72px)/1 Sora;letter-spacing:-.07em;margin:10px 0}em{font-style:normal;color:#d5adff}.kicker{font-size:10px;letter-spacing:.16em;color:#cca8ff;font-weight:bold}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:35px 0}.filters button{border:1px solid #ffffff28;border-radius:99px;padding:10px 15px;color:#ddd;background:#ffffff0c;cursor:pointer}.filters button.active,.filters button:hover{background:#6c3bff;color:#fff}.help{margin:0 0 30px;padding:19px 22px;border:1px solid #ffffff22;border-radius:13px;background:linear-gradient(100deg,#632ee955,#ff4d9d22);display:flex;justify-content:space-between;align-items:center;gap:12px}.help b{font:700 18px Sora}.help button,.book{border:0;background:#fff;color:#17121e;padding:11px 15px;border-radius:8px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{height:335px;border-radius:14px;overflow:hidden;position:relative;background:#222}.card img{width:100%;height:100%;object-fit:cover}.card:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,#0a0a0ee8)}.info{position:absolute;z-index:1;bottom:0;left:0;right:0;padding:17px}.top{display:flex;justify-content:space-between;font-size:9  M.','DJ','Delhi','4.8','1524368535928-5b5e00ddc76b'],['Meera & Crew','Dancer','Mumbai','5.0','1508214751196-bcfd4ca60f91'],['Arjun Roy','Rapper','Bengaluru','4.9','1531058020387-3be344556be6'],['Ishita Kapoor','Comedian','Pune','4.8','1485968579580-b6d095142e6e'],['Kabir Malhotra','DJ','Gurugram','4.9','1571266028243-d220c9c3b7cb'],['Aarohi Sen','Singer','Kolkata','4.8','1492562080023-ab3db95bfbce'],['The Midnight Set','Dancer','Jaipur','4.7','1501386761578-eac5c94b800a'],['Nakul Batra','Comedian','Mumbai','4.9','1500648767791-00dcc994a43e'],['Naya Beat','Rapper','Delhi','4.8','1516280440614-37939bbacd81']];const grid=document.querySelector('#grid');function draw(f='all'){grid.innerHTML=a.filter(x=>f==='all'||x[1]===f).map(x=>`<article class="card"><img src="https://images.unsplash.com/photo-${x[4]}?auto=format&fit=crop&w=600&q=80"><div class="info"><div class="top"><span>${x[1].toUpperCase()}</span><span>★ ${x[3]}</span></div><h3>${x[0]}</h3><p>${x[2]}</p></div></article>`).join('')}draw();document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');draw(b.dataset.filter)});const m=document.querySelector('#modal');help.onclick=()=>m.classList.add('open');m.onclick=e=>{if(e.target===m)m.classList.remove('open')};send.onclick=()=>{document.querySelector('.panel').innerHTML='<h2>Thank you.</h2><p>Our team will contact you within 24 hours with recommendations.</p>'}</script></body></html>
<script>function addBookingActions(){document.querySelectorAll('.card').forEach(card=>{if(card.querySelector('.quick-book'))return;const b=document.createElement('button');b.className='quick-book';b.textContent='Book artist →';card.querySelector('.info').append(b);b.onclick=e=>{e.stopPropagation();const name=card.querySelector('h3').textContent,type=card.querySelector('.top span').textContent,location=card.querySelector('p').textContent,rating=card.querySelector('.top span:last-child').textContent;const pop=document.createElement('div');pop.className='booking-pop';pop.innerHTML=`<section><button class="x">×</button><span>VERIFIED A-HUB ARTIST ✓</span><h2>${name}</h2><p>${type} · ${location} · ${rating}</p><p class="copy">Profile verified through A-Hub’s quality checks. Explore performance work, portfolio and artist links before booking.</p><button class="action availability">Check availability →</button><div class="calendar"><b>August 2026</b><p><i>1</i><i class="off">2</i><i>3</i><i>4</i><i class="off">5</i><i>6</i><i>7</i></p><small>● Available &nbsp; ○ Unavailable</small><button class="action continue">Continue with selected date →</button></div><div class="enquiry"><input placeholder="Your name"><input placeholder="Phone number"><input placeholder="Event type and location"><button class="action submit">Send booking enquiry →</button></div></section>`;document.body.append(pop);pop.querySelector('.x').onclick=()=>pop.remove();pop.querySelector('.availability').onclick=()=>{pop.querySelector('.calendar').style.display='block';pop.querySelector('.availability').style.display='none'};pop.querySelectorAll('.calendar i:not(.off)').forEach(d=>d.onclick=()=>{pop.querySelectorAll('.calendar i').forEach(x=>x.classList.remove('picked'));d.classList.add('picked')});pop.querySelector('.continue').onclick=()=>{pop.querySelector('.enquiry').style.display='grid';pop.querySelector('.calendar').style.display='none'};pop.querySelector('.submit').onclick=()=>{pop.querySelector('section').innerHTML='<h2>Thank you.</h2><p>Our booking team will reach out within 24 hours to confirm availability and next steps.</p>'}})})}addBookingActions();new MutationObserver(addBookingActions).observe(document.querySelector('#grid'),{childList:true});</script><style>.quick-book{margin-top:12px;width:100%;border:0;border-radius:7px;padding:9px;background:#fff;color:#17121e;font:800 10px Manrope;cursor:pointer}.booking-pop{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#080810cc;padding:20px}.booking-pop section{position:relative;width:min(420px,100%);background:#f7f4fb;color:#211a2a;border-radius:18px;padding:28px}.booking-pop .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:25px;cursor:pointer}.booking-pop span{font-size:9px;font-weight:800;letter-spacing:.11em;color:#713dd5}.booking-pop h2{font:700 30px Sora;margin:10px 0}.booking-pop p{font-size:12px;color:#655d6d;line-height:1.6}.booking-pop .copy{border-top:1px solid #ddd4e4;padding-top:13px}.action{border:0;border-radius:8px;background:#6c3bff;color:#fff;padding:12px;width:100%;font:800 12px Manrope;cursor:pointer}.calendar,.enquiry{display:none;margin-top:15px}.calendar p{display:flex;gap:7px}.calendar i{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:#e5daf7;font-style:normal;cursor:pointer}.calendar i.off{background:#e8e5e8;color:#aaa;text-decoration:line-through;cursor:not-allowed}.calendar i.picked{background:#6c3bff;color:#fff}.calendar small{display:block;margin:10px 0;color:#72697c}.enquiry{gap:8px}.enquiry input{border:1px solid #d6cde0;border-radius:7px;padding:11px;font:12px Manrope}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const add=()=>document.querySelectorAll('.card').forEach(c=>{if(c.querySelector('.visible-book'))return;const b=document.createElement('button');b.className='visible-book';b.textContent='Book artist →';c.querySelector('.info').append(b);b.onclick=e=>{e.stopPropagation();const n=c.querySelector('h3').textContent;const p=document.createElement('div');p.className='simple-book';p.innerHTML=`<div><button class="close-book">×</button><small>VERIFIED A-HUB ARTIST</small><h2>${n}</h2><p>Explore verified work, ratings and availability before confirming your booking.</p><button class="next-book">Check availability →</button><section class="availability"><b>Available dates · August</b><p><i>3</i><i>4</i><i>7</i><i>9</i></p><button class="confirm-book">Continue with selected date →</button></section><section class="booking-form"><input placeholder="Your name"><input placeholder="Phone number"><input placeholder="Event type and location"><button class="send-book">Send booking enquiry →</button></section></div>`;document.body.append(p);p.querySelector('.close-book').onclick=()=>p.remove();p.querySelector('.next-book').onclick=()=>{p.querySelector('.availability').style.display='block';p.querySelector('.next-book').style.display='none'};p.querySelectorAll('.availability i').forEach(x=>x.onclick=()=>{p.querySelectorAll('.availability i').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});p.querySelector('.confirm-book').onclick=()=>{p.querySelector('.booking-form').style.display='grid';p.querySelector('.availability').style.display='none'};p.querySelector('.send-book').onclick=()=>p.querySelector('div').innerHTML='<h2>Thank you.</h2><p>Our booking team will reach out within 24 hours.</p>'}});add();new MutationObserver(add).observe(document.querySelector('#grid'),{childList:true})});</script><style>.visible-book{display:block;width:100%;margin-top:12px;padding:10px;border:0;border-radius:8px;background:# <script>document.addEventListener('DOMContentLoaded',()=>{const filters=document.querySelector('.filters'),bar=document.createElement('div');bar.className='availability-filter';bar.innerHTML='<label>📍 Location<select id="artist-location"><option value="">All locations</option><option>Chandigarh</option><option>Delhi</option><option>Mumbai</option><option>Bengaluru</option><option>Pune</option><option>Gurugram</option><option>Kolkata</option><option>Jaipur</option></select></label><label>📅 Event date<input id="artist-date" type="date"></label><button id="apply-availability">Check availability</button><small id="availability-result">Choose a location and date to see available artists.</small>';filters.after(bar);const apply=()=>{const city=document.querySelector('#artist-location').value,date=document.querySelector('#artist-date').value,day=date?new Date(date+'T12:00:00').getDate():0;let count=0;document.querySelectorAll('.card').forEach((card,i)=>{const matchCity=!city||card.querySelector('.info p').textContent.trim()===city;const free=!date||((i+day)%3!==0);const visible=matchCity&&free;card.style.display=visible?'':'none';if(visible)count++});document.querySelector('#availability-result').textContent=(city&&date)?`${count} artist${count===1?'':'s'} available in ${city} on this date.`:'Choose a location and date to see available artists.'};document.querySelector('#apply-availability').onclick=apply;document.querySelector('#artist-location').onchange=apply;document.querySelector('#artist-date').onchange=apply})</script><style>.availability-filter{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:-15px 0 30px;padding:14px;border:1px solid #ffffff22;border-radius:13px;background:#ffffff0a}.availability-filter label{display:grid;gap:6px;font-size:10px;font-weight:800;color:#d7cde0}.availability-filter select,.availability-filter input{min-width:150px;padding:10px;border:1px solid #ffffff25;border-radius:7px;background:#211b2b;color:#fff;font:12px Manrope}.availability-filter button{padding:11px 14px;border:0;border-radius:7px;background:linear-gradient(100deg,#6c3bff,#eb55ad);color:#fff;font:800 11px Manrope;cursor:pointer}.availability-filter small{width:100%;color:#c9bfd3;font-size:10px}@media(max-width:520px){.availability-filter label,.availability-filter select,.availability-filter input{width:100%}.availability-filter button{width:100%}}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const city=document.querySelector('#artist-location'),date=document.querySelector('#artist-date'),apply=document.querySelector('#apply-availability'),result=document.querySelector('#availability-result');city.onchange=null;date.onchange=null;apply.onclick=()=>{const day=date.value?new Date(date.value+'T12:00:00').getDate():0;let count=0;document.querySelectorAll('.card').forEach((card,i)=>{const sameCity=!city.value||card.querySelector('.info p').textContent.trim()===city.value;const free=!date.value||((i+day)%3!==0);card.style.display=sameCity&&free?'':'none';if(sameCity&&free)count++});result.textContent=(city.value&&date.value)?`${count} artist${count===1?'':'s'} available in ${city.value} on this date.`:'Choose both location and date, then check availability.'};document.addEventListener('click',e=>{const book=e.target.closest('.visible-book');if(!book||!date.value)return;e.preventDefault();e.stopImmediatePropagation();const name=book.closest('.card').querySelector('h3').textContent,p=document.createElement('div');p.className='simple-book';p.innerHTML=`<div><button class="close-book">×</button><small>DATE PRE-SELECTED · ${date.value}</small><h2>Book ${name}</h2><p>Your selected date is already available. Tell us a little about your event and our team will reach out within 24 hours.</p><section class="booking-form" style="display:grid"><input placeholder="Your name"><input placeholder="Phone number"><input placeholder="Event type and location"><button class="send-book">Send booking enquiry →</button></section></div>`;document.body.append(p);p.querySelector('.close-book').onclick=()=>p.remove();p.querySelector('.send-book').onclick=()=>p.querySelector('div').innerHTML='<h2>Thank you.</h2><p>Our booking team will reach out within 24 hours.</p>'},true)})</script>
<script>document.addEventListener('DOMContentLoaded',()=>{let selectedType='all',availabilityApplied=false;const city=document.querySelector('#artist-location'),date=document.querySelector('#artist-date'),apply=document.querySelector('#apply-availability'),result=document.querySelector('#availability-result');const filterCards=()=>{const day=date.value?new Date(date.value+'T12:00:00').getDate():0;let count=0;document.querySelectorAll('.card').forEach((card,i)=>{const type=card.querySelector('.top span').textContent.trim().toLowerCase(),matchesType=selectedType==='all'||type===selectedType.toLowerCase(),matchesCity=!availabilityApplied||!city.value||card.querySelector('.info p').textContent.trim()===city.value,matchesDate=!availabilityApplied||!date.value||((i+day)%3!==0),show=matchesType&&matchesCity&&matchesDate;card.style.display=show?'':'none';if(show)count++});if(availabilityApplied)result.textContent=`${count} ${selectedType==='all'?'artist':selectedType.toLowerCase()+' artist'}${count===1?'':'s'} available${city.value?' in '+city.value:''}${date.value?' on this date':''}.`};document.querySelectorAll('.filters button[data-filter]').forEach(button=>{button.onclick=()=>{selectedType=button.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));button.classList.add('active');filterCards()}});apply.onclick=()=>{availabilityApplied=true;filterCards()}})</script>
